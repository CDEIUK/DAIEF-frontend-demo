# Author survey content by section. Keep text values as strings.
# Questions are shown in this order in the survey.
form_version: v0.3

sections:

  - name: Project Detail
    questions:

      - reference: NAME
        field_text: Give your project a name.
        component_type: short text
        trigger: None
        daief_themes: N/A

      - reference: FILTER
        field_text: Select your project filters.
        component_type: multiselect
        trigger: None
        daief_themes: N/A
        options:
          a: My project involves the collection, use, or sharing of data
          b: My project involves the use of AI or broader algorithmic tools
          c: My project involves direct interaction with the public
          d: My project involves making decisions with a significant or legal effects
          e: My project involves work in a safety-critical area (e.g. policing, healthcare, working with
            vulnerable people)
        hint_text: Your answers will be used to show you the questions most relevant to your work. If
          you are not sure whether a statement applies, we encourage you to select it. This will help
          to ensure that potential risks and opportunities are captured and explored.

      - reference: PROB
        field_text: Describe the problem you’re trying to solve in simple terms.
        component_type: text
        trigger: None
        daief_themes: N/A

      - reference: PURP
        field_text: Describe how your solution solves this problem.
        component_type: text
        trigger: None
        daief_themes: N/A

  - name: Discovery
    questions:

      - reference: '1'
        field_text: Have you consulted your organisation’s Data Protection Officer (DPO) about your project?
        component_type: radios
        trigger: FILTER=a
        daief_themes: Accountability, Privacy
        options:
          a: 'Yes'
          b: 'No'
        hint_text: See the ICO website for more information about DPOs.

