        daief_themes: Accountability, Privacy
        options:
          a: 'Yes'
          b: 'No'

      - reference: 4b
        field_text: Are you confident that the data sharing benefits are necessary and proportional to
          any privacy risks incurred?
        component_type: radios
        trigger: 4=Yes
        daief_themes: Accountability, Privacy
        options:
          a: 'Yes'
          b: 'No'
          c: Unsure

      - reference: 4S
        field_text: 'Where personal data is being processed, you must comply with relevant laws: You need
          to carry out a Data Protection Impact Assessment (DPIA) before you process personal data when
          the processing is likely to result in a high risk to the rights and freedoms of individuals.
          It’s good practice to publish your completed DPIA to demonstrate that you’re taking the appropriate
          precautions to protect personal data and ensure your system is fair.


          Your organisation’s data protection officer (DPO) or information assurance team should be able
          to advise on your data protection obligations.


          New data assets should be registered via organisational data catalogues, or cross-departmentally
          by designating [Essential Shared Data Assets (ESDAs)].'
        component_type: suggestion
        trigger: 4=No OR Unsure
        daief_themes: Accountability, Privacy
        field_text_hyperlinks: https://www.gov.uk/government/publications/essential-shared-data-assets-and-data-ownership-in-government/essential-shared-data-assets-esdas-guidance-for-departments-html

