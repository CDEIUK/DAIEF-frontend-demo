        field_text: Briefly explain how data sharing achieves a benefit and is necessary.
        component_type: text
        trigger: 4b=Yes
        daief_themes: Accountability, Privacy

      - reference: 4bS
        field_text: ''
        component_type: suggestion
        trigger: 4b=No OR Unsure
        daief_themes: Accountability, Privacy

      - reference: '5'
        field_text: Do you have governance structures to support the safe, effective and responsible implementation
          of the project?
        component_type: radios
        trigger: FILTER=c OR d OR e
        daief_themes: Accountability
        options:
          a: 'Yes'
          b: Somewhat
          c: 'No'

      - reference: 5T
        field_text: Briefly describe the governance structures that will support this project.
        component_type: text
        trigger: 5=Yes
        daief_themes: Accountability

      - reference: 5S
        field_text: 'You should always follow your organisation’s internal governance policies

          Data and AI projects should have appropriate and effective governance and oversight. This includes
          clear roles and responsibilities, clear documentation, and being transparent about the system
          and the processes around it.'
        component_type: suggestion
        trigger: 5=Somewhat OR No
        daief_themes: Accountability

      - reference: '6'
        field_text: Have you assigned responsibility for the project’s outcomes?
        component_type: radios
        trigger: FILTER=c OR d OR e
        daief_themes: Accountability, Safety
        options:
          a: 'Yes'
          b: 'No'

      - reference: 6a
        field_text: Is the responsible owner able to oversee the project effectively and intervene quickly
          if in the case of harmful outcomes?
        component_type: radios
        trigger: 6=Yes
        daief_themes: Accountability, Safety
        options:
          a: 'Yes'
          b: 'No'
          c: Unsure

      - reference: 6S
        field_text: 'You need strong oversight and clear responsibilities to ensure accountability across
          the life cycle of your project. You must set out who is responsible at each stage of the project.


          This includes naming: senior responsible owners (SROs), data owners, data stewards, data custodians,
          and AI asset owners.'
        component_type: suggestion
        trigger: 6=No
        daief_themes: Accountability, Safety

      - reference: 6aT
        field_text: Briefly describe any barriers to responsible owner intervention that you foresee.
        component_type: text
        trigger: 6a=Yes
        daief_themes: Accountability, Safety

      - reference: 6aS
        field_text: "As the primary risk owners for the project, senior responsible owners ensure a real\
          \ policy or business need is being addressed, engage with stakeholders and assure ongoing viability.\
          \ \nFor project governance to be effective, it’s essential that the people accountable have\
          \ appropriate technical expertise and knowledge, and authority, to implement necessary changes.\
          \ This is especially important for complex projects or those involving multiple suppliers, which\
          \ is often the case with data and AI projects."
        component_type: suggestion
        trigger: 6a=No OR Unsure
        daief_themes: Accountability, Safety

      - reference: '7'
        field_text: Are you confident in documenting key project decisions?
        component_type: radios
        trigger: FILTER=c OR d OR e
        daief_themes: Transparency, Accountability
        options:
          a: 'Yes'
          b: Somewhat
          c: 'No'

      - reference: 7T
        field_text: Provide the types of key decisions that you'll document.
        component_type: text
        trigger: 7=Yes
        daief_themes: Transparency, Accountability

      - reference: 7Ta
        field_text: Provide the types of routines or processes that you'll use to document decisions.
        component_type: text
        trigger: 7=Yes
        daief_themes: Transparency, Accountability

      - reference: 7Tb
        field_text: Provide the ways in which people will be able to learn more about key decisions if
          needed.
        component_type: text
        trigger: 7=Yes
        daief_themes: Transparency, Accountability

      - reference: 7S
        field_text: 'To ensure AI and data projects can be audited or reviewed, your team must: record
          who is responsible for each part of the system, including suppliers, and record decisions made
          during project design, model deployment and system deployment processes.


          For example, a data set factsheet can help explain how data was handled.

          The [Algorithmic Transparency Recording Standard (ATRS)] also provides a template for public
          sector organisations to document and share information about how and why they’re using algorithmic
          tools.'
        component_type: suggestion
        trigger: 7= Somewhat OR No
        daief_themes: Transparency, Accountability
        field_text_hyperlinks: https://www.gov.uk/government/publications/algorithmic-transparency-template

      - reference: '8'
        field_text: Will you conduct research as part of your project?
        component_type: radios
        trigger: FILTER=a OR b OR c OR d OR e
        daief_themes: Safety
        options:
          a: 'Yes'
          b: 'No'
          c: Unsure

      - reference: 8a
        field_text: Are you confident in protecting research participants from safety risks?
        component_type: radios
        trigger: 8=Yes
        daief_themes: Safety
        options:
          a: 'Yes'
          b: 'No'
          c: Unsure

      - reference: 8b
        field_text: Are you confident in protecting reseachers from safety risks?
        component_type: radios
        trigger: 8=Yes
        daief_themes: Safety
        options:
          a: 'Yes'
          b: 'No'
          c: Unsure

      - reference: 8S
        field_text: 'When designing a government tool or service, you should always start by learning
          about the people who will use it. If you don’t understand users or what they need from your
          service, you cannot build the right thing.


          You should involve diverse stakeholders in the design and testing process and undertake thorough
          user research and public engagement to ensure you’re including the views of those that may be
          affected or digitally excluded.


          You must understand and comply with your legal obligations and duties. Refer to the Public Sector
          Equality Duty (PSED) and the Equality Act 2010.'
        component_type: suggestion
        trigger: 8=No OR Unsure
        daief_themes: Safety

      - reference: 8aT
        field_text: Describe the measures you will take to protect research particpants.
        component_type: text
        trigger: 8a=Yes
        daief_themes: Safety

      - reference: 8aS
        field_text: "You must take steps to protect research participants. This applies to your team and\
          \ to any third-party researchers you work with. \n\nYou should:\no make sure that participants\
          \ understand the research and any risks involved \no only include participants who give clear,\
          \ informed consent without pressure or coercion \no allow participants to withdraw at any time\
          \ (with exceptions for situations like medical research where participant information is anonymised\
          \ and aggregated and cannot be removed from the research data set)\no anonymise all data used\
          \ in reports or analysis.\n\nThe Service Manual has guidance on [managing user research data\
          \ and participant privacy]."
        component_type: suggestion
        trigger: 8a=No OR Unsure
        daief_themes: Safety
        field_text_hyperlinks: https://www.gov.uk/service-manual/user-research/managing-user-research-data-participant-privacy

      - reference: 8bT
        field_text: Describe the measures you will take to protect researchers.
        component_type: text
        trigger: 8b=Yes
        daief_themes: Safety

      - reference: 8bS
        field_text: 'Some research projects involve sensitive topics, such as child protection or adult
          safeguarding. These can be distressing for both researchers and participants. To reduce risk,
          you should:

          o highlight any sensitive topics in workshop or interview plans

          o set up a ‘safety check-in’ protocol to support staff after sessions, particularly for one-to-one
          or lone working

          o use existing ethical guidelines and processes, such as the Service Manual’s guidance on researching
          emotionally sensitive subjects


          In rare cases, researchers may be targeted by participants or others. If this happens, or if
          the risk is known in advance, put safeguards in place to protect staff.


          The Government Analysis Function provides a list of resources related to conducting research
          and analysis in government.'
        component_type: suggestion
        trigger: 8b=No OR Unsure
        daief_themes: Safety

      - reference: '9'
        field_text: Can you ensure that your project team is diverse and multidisciplinary?
        component_type: radios
        trigger: FILTER=a OR b OR c OR d OR e
        daief_themes: Fairness, Societal Impact
        options:
          a: 'Yes'
          b: 'No'
          c: Unsure

      - reference: 9a
        field_text: Have you considered how a lack of diversity might impact your project?
        component_type: radios
        trigger: 9=No OR Unsure
        daief_themes: Fairness, Societal Impact
        options:
          a: 'Yes'
          b: 'No'

      - reference: 9T
        field_text: Briefly describe how you will ensure diversity across the team.
        component_type: text
        trigger: 9=Yes
        daief_themes: Fairness, Societal Impact

      - reference: 9aT
        field_text: Briefly describe any risks or blind spots you have identified.
        component_type: text
        trigger: 9a=Yes
        daief_themes: Fairness, Societal Impact

      - reference: 9aS
        field_text: 'Having a diverse and multidisciplinary team can provide a strong foundation for building
          fairer tools and services. A diverse team is often able to spot issues early in the development
          process by bringing varied perspectives and lived experiences.


          If it’s not possible to assemble a diverse team, you should note any potential gaps in understanding
          and proactively seek ways to engage with a variety of stakeholders. This might include through
          user testing, public engagement and, where possible, presenting ideas at internal or external
          community events.


          The Service Manual includes guidance on the [people you need to have in your team at each phase].'
        component_type: suggestion
        trigger: 9a=No
        daief_themes: Fairness, Societal Impact
        field_text_hyperlinks: https://www.gov.uk/service-manual/the-team/set-up-a-service-team

      - reference: '10'
        field_text: Do you have a clear picture of your target user groups?
        component_type: radios
        trigger: FILTER=a OR b OR c OR d OR e
        daief_themes: Fairness, Societal Impact
        options:
          a: 'Yes'
          b: Somewhat
          c: 'No'

      - reference: 10a
        field_text: Have you considered how different groups could be impacted unequally by your project?
        component_type: radios
        trigger: 10=Yes
        daief_themes: Fairness, Societal Impact
        options:
          a: 'Yes'
          b: Somewhat
          c: 'No'

      - reference: 10S
        field_text: 'At the start of your project, you should make sure that:

          o your project has a clear purpose

          o there’s a clear public benefit

          o you’re designing with humans in mind and in a human-centred way.


          You should involve diverse stakeholders in the design and testing process and undertake thorough
          user research and public engagement to ensure you’re including the views of those that may be
          affected or digitally excluded.


          You must understand and comply with your legal obligations and duties. Refer to the [Public
          Sector Equality Duty (PSED)] and the [Equality Act 2010].


          You should continually revisit user needs throughout your project. The Service Manual explains
          more about [user needs].'
        component_type: suggestion
        trigger: 10=Somewhat OR No
        daief_themes: Fairness, Societal Impact
        field_text_hyperlinks: 'https://www.equalityhumanrights.com/guidance/public-sector-equality-duty-psed

          https://www.gov.uk/guidance/equality-act-2010-guidance

          https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs'

      - reference: 10aT
        field_text: Briefly describe how your user groups may be impacted differently.
        component_type: text
        trigger: 10a=Yes
        daief_themes: Fairness, Societal Impact

      - reference: 10aS
        field_text: 'You should involve diverse stakeholders in the design and testing process and undertake
          thorough user research and public engagement to ensure you’re including the views of those that
          may be affected or digitally excluded.


          You must understand and comply with your legal obligations and duties. Refer to the [Public
          Sector Equality Duty (PSED)] and the [Equality Act 2010].


          You should continually revisit user needs throughout your project. The Service Manual explains
          more about [user needs].'
        component_type: suggestion
        trigger: 10a=Somewhat OR No
        daief_themes: Fairness, Societal Impact
        field_text_hyperlinks: 'https://www.equalityhumanrights.com/guidance/public-sector-equality-duty-psed

          https://www.gov.uk/guidance/equality-act-2010-guidance

          https://www.gov.uk/service-manual/user-research/start-by-learning-user-needs'

      - reference: '11'
        field_text: Do you have a clear picture of all your project stakeholders?
        component_type: radios
        trigger: FILTER=a OR b OR c OR d OR e
        daief_themes: Fairness, Societal Impact
        options:
          a: 'Yes'
          b: Somewhat
          c: 'No'

      - reference: 11a
        field_text: Will you engage with a wide variety of stakeholders throughout the project lifecycle?
        component_type: radios
        trigger: 11=Yes
        daief_themes: Fairness, Societal Impact
        options:
          a: 'Yes'
          b: 'No'
          c: Unsure

      - reference: 11S
        field_text: 'You should include stakeholder perspectives by engaging with civil society groups,
          affected communities and wider public sector to understand values and impacts.


          Proactive public and stakeholder engagement is critical to understand the potential impacts
          of a tool or system. Engaging with stakeholders can help to build trust and improve adoption
          of AI tools and systems.'
        component_type: suggestion
        trigger: 11=Somewhat OR No
        daief_themes: Fairness, Societal Impact

      - reference: 11aT
        field_text: Briefly describe the steps you will take to engage with a wide variety of stakeholders.
        component_type: text
        trigger: 11a=Yes
        daief_themes: Fairness, Societal Impact

      - reference: 11aS
        field_text: 'You should include stakeholder perspectives by engaging with civil society groups,
          affected communities and wider public sector to understand values and impacts.


          Ethical use of data and AI means listening to different perspectives and checking that your
          tools work as intended. Otherwise, you could unintentionally exclude people or cause harm.'
        component_type: suggestion
        trigger: 11a=No OR Unsure
        daief_themes: Fairness, Societal Impact

      - reference: '12'
        field_text: Will you work with civil society organisations or external domain experts to guide
          your project?
        component_type: radios
        trigger: FILTER=c OR d OR e
        daief_themes: Societal impact
        options:
          a: 'Yes'
          b: 'No'
          c: Unsure

      - reference: 12T
        field_text: Briefly describe how you'll engage with civil society organisations and external experts.
        component_type: text
        trigger: 12=Yes
        daief_themes: Societal impact

