      - reference: '13'
        field_text: Have you considered the potential environmental impact and sustainability of your
          project?
        component_type: radios
        trigger: FILTER=a OR b
        daief_themes: Environmental sustainability
        options:
          a: 'Yes'
          b: Somewhat
          c: 'No'

      - reference: 13a
        field_text: Will you monitor, evaluate and address environmental impact and sustainability challenges
          throughout the project lifecycle?
        component_type: radios
        trigger: 13=Yes OR Somewhat
        daief_themes: Environmental sustainability
        options:
          a: 'Yes'
          b: 'No'
          c: Unsure

      - reference: 13T
        field_text: Briefly explain the environmental and sustainability implications of your project.
        component_type: text
        trigger: 13=Yes OR Somewhat
        daief_themes: Environmental sustainability

      - reference: 13S
        field_text: 'Environmental sustainability means thinking about the wider impact of your project
          on people and the planet. It’s important to consider this from the start, as it can influence
          your choices about tools, suppliers and infrastructure.


          The environmental sustainability chapter in the Data and AI Ethics Framework provides further
          advice on how to assess the potential impact of data and AI projects.'
        component_type: suggestion
        trigger: 13=No
        daief_themes: Environmental sustainability

      - reference: 13aT
        field_text: Briefly describe how you intend to monitor, evaluate and address environmental impact
          and sustainability challenges.
        component_type: text
        trigger: 13a=Yes
        daief_themes: Environmental sustainability

      - reference: 13aS
        field_text: "Before you begin building a tool or system, you should develop a plan to monitor\
          \ and evaluate the environmental impact.\n\nYou should think about factors such as: \no Whether\
          \ AI is the best technology or tool for the task – there may be alternatives that provide as\
          \ good, or better, results and require less resource-intensive training and development.\no\
          \ Project size and complexity – how much data will be processed, the number of end users, bandwidth\
