        component_type: radios
        trigger: FILTER=a OR b OR c
        daief_themes: Accountability, Privacy, Safety
        options:
          a: 'Yes'
          b: 'No'

      - reference: 2a
        field_text: Have you received all the security advice that you need?
        component_type: radios
        trigger: 2=Yes
        daief_themes: Accountability, Privacy, Safety
        options:
          a: 'Yes'
          b: 'No'
          c: Unsure

      - reference: 2b
        field_text: Do you intend to follow all the advice that you've received?
        component_type: radios
        trigger: 2a=Yes
        daief_themes: Accountability, Privacy, Safety
        options:
          a: 'Yes'
          b: 'No'
          c: Unsure

      - reference: 2S
        field_text: "You should involve information governance teams early in the project design process\
          \ – this will help you to comply with privacy and data protection legislation, and plan resources\
          \ effectively so that support is available for project teams when needed.\n\nYour organisation’s\
          \ data and information security team should be able to advise on security requirements and risks.\
          \ \n\nRefer to the government’s [personal data security principles] when processing and sharing\
          \ personal data.\n\nIf you’re working with any third-party suppliers to store, collect or process\
          \ data, make sure they’re vetted and that they comply with the security requirements of your\
          \ project."
        component_type: suggestion
        trigger: 2=No
        daief_themes: Accountability, Privacy, Safety
        field_text_hyperlinks: https://www.gov.uk/guidance/principles-for-securing-personal-data-in-government-services

      - reference: 2aT
        field_text: Provide a brief summary of security advice that you received
        component_type: text
